{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm border-0 rounded-4 p-4" style="max-width: 450px; width: 100%;">
        <div class="text-center mb-4">
            <i class="fa-solid fa-envelope-open-text fa-3x text-primary mb-3"></i>
            <h4 class="fw-bold">Forgot Password?</h4>
            <p class="text-muted small">Enter the email address associated with your account and we'll send you a link to reset your password.</p>
        </div>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}" />
            
            <div class="mb-4">
                <label for="email" class="form-label small fw-bold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-at"></i></span>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="john@abes.edu">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-semibold shadow-sm mb-3">Send Reset Link</button>
            
            <div class="text-center">
                <a href="{{ url_for('auth.login') }}" class="text-decoration-none small text-secondary"><i class="fa-solid fa-arrow-left me-1"></i>Back to Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
