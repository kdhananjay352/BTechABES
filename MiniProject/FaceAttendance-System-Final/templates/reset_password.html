{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card auth-form-card shadow-sm rounded-4" style="max-width: 450px; width: 100%;">
        <div class="auth-form-header text-center p-4">
            <i class="fa-solid fa-key fa-3x text-success mb-3"></i>
            <h4 class="fw-bold mb-1">Create New Password</h4>
            <p class="text-muted small mb-0">Your identity has been verified. Please enter your new password below.</p>
        </div>

        <div class="auth-form-body p-4">
            <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}" />

                <div class="mb-3">
                    <label for="new_password" class="form-label small fw-bold">New Password</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" required
                        minlength="8">
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label small fw-bold">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required
                        minlength="8">
                </div>

                <button type="submit" class="btn btn-success w-100 fw-semibold shadow-sm">Reset Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
